name: Release

# Run by hand from the Actions tab, on main. With "publish" unticked (the default), a dry run: the
# checks, the bundle and the npm package are built and checked, and nothing is published. Ticked, it
# releases the version in package.json: tag, GitHub release with the attested bundle, npm package.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release (unticked, a dry run that publishes nothing)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  check:
    name: Check the branch and the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only local git commands and an anonymous read of the public tags follow.
          persist-credentials: false
      - name: Check the branch and the version
        id: check
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::run the release on main, not $GITHUB_REF"
            exit 1
          fi
          version=$(jq -r .version package.json)
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            if [ "$PUBLISH" = true ]; then
              echo "::error::v$version is already released: bump the version first"
              exit 1
            fi
            echo "::warning::v$version is already released: this dry run checks it again"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  bundle:
    name: Claude Desktop bundle
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Builds build/vigueur-<version>.mcpb, then checks it: valid manifest, exactly the runtime
      # packages, no source, test or hidden file, and the server starts from it.
      - run: npm run test:bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpb
          path: build/vigueur-${{ needs.check.outputs.version }}.mcpb
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  github:
    name: GitHub release
    needs: [ci, check, bundle]
    runs-on: ubuntu-latest
    permissions:
      # Creates the tag and the release.
      contents: write
      # The attestation: a short-lived signing identity, and the right to store the signed record.
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: v${{ needs.check.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcpb
          path: build
      - name: Dry run
        if: ${{ !inputs.publish }}
        run: |
          echo "Dry run: built and checked build/vigueur-$VERSION.mcpb, published nothing." >> "$GITHUB_STEP_SUMMARY"
      # A signed record that this workflow built the bundle from this commit (SLSA build
      # provenance), kept by GitHub and checked with `gh attestation verify`. Made before the release,
      # so a release never ships without it.
      - name: Attest the bundle
        if: inputs.publish
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/vigueur-${{ env.VERSION }}.mcpb
      # Creates the tag on the commit the workflow ran on, and the release. GitHub writes the notes
      # (the pull requests merged since the previous tag, and a link to the full comparison) and shows
      # each file's SHA-256 on the release page. Fails if the release already exists: a release is
      # never overwritten.
      - name: Publish
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "build/vigueur-$VERSION.mcpb" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "vigueur-mcp $TAG" --generate-notes "${flags[@]}"

  # Last: a version published on npm is final, so it goes out only after the GitHub release.
  npm:
    name: npm package
    needs: [check, github]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: npm takes this short-lived identity instead of a token, so the
      # repository holds no npm token. npm also records the package's provenance with it.
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      PUBLISH: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 24 comes with npm 11; trusted publishing needs npm 11.5.1 or later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Check the npm version
        run: |
          npm_version=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -n 1)" != 11.5.1 ]; then
            echo "::error::npm $npm_version is older than 11.5.1, which trusted publishing needs"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      # A pre-release goes under the npm tag `next`, so that `npx vigueur-mcp` keeps the latest
      # release. A version published on npm can never be published again, even after an unpublish:
      # if this job fails, re-run it alone.
      - name: Publish
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--tag next); fi
          if [ "$PUBLISH" != true ]; then flags+=(--dry-run); fi
          npm publish "${flags[@]}"
      - name: Dry run
        if: ${{ !inputs.publish }}
        run: |
          echo "Dry run: built and packed vigueur-mcp@$VERSION, published nothing to npm." >> "$GITHUB_STEP_SUMMARY"
