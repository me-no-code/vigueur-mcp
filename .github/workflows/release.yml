name: Release

on:
  push:
    tags: ["v*.*.*"]
  # A dry run from the Actions tab: runs the checks, builds and checks the bundle, and publishes
  # nothing: no attestation, no release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  mcpb:
    name: Claude Desktop bundle
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Only local git commands follow; gh gets its own token. No key is left in git's config.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Check the tag and the commit
        id: check
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_SHA is not on main"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      # Builds build/vigueur-<version>.mcpb, then checks it: valid manifest, exactly the runtime
      # packages, no source, test or hidden file, and the server starts from it.
      - run: npm run test:bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpb
          path: build/vigueur-${{ steps.check.outputs.version }}.mcpb
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish:
    name: Publish the release
    needs: [ci, mcpb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The attestation: a short-lived signing identity, and the right to store the signed record.
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.mcpb.outputs.version }}
      TAG: v${{ needs.mcpb.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcpb
          path: build
      - name: Dry run
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Dry run: built and checked build/vigueur-$VERSION.mcpb, published nothing." >> "$GITHUB_STEP_SUMMARY"
      # A signed record that this workflow built the bundle from the tagged commit (SLSA build
      # provenance), kept by GitHub and checked with `gh attestation verify`. Made before the release,
      # so a release never ships without it.
      - name: Attest the bundle
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/vigueur-${{ env.VERSION }}.mcpb
      # GitHub writes the notes (a link to every change since the previous tag, and the pull requests
      # merged) and shows each file's SHA-256 on the release page. Fails if the release already
      # exists: a release is never overwritten.
      - name: Publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "build/vigueur-$VERSION.mcpb" --repo "$GITHUB_REPOSITORY" \
            --title "vigueur-mcp $TAG" --generate-notes --verify-tag "${flags[@]}"
